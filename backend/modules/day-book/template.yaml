AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  eTRON day book function template

Parameters:
  AppConfigurationBucketName:
    Type: String
  WorkspaceBucketName:
    Type: String
  AthenaDatabaseName:
    Type: String
    Default: etron_day_book_db
  AuditQueueUrl:
    Type: String
  AppSyncUrl:
    Type: String
  AppSyncApiKey:
    Type: String
  UserPoolArn:
    Type: String
  DashboardRawDataBucketName:
    Type: String
    Default: micromax-dashboard-raw-data

Globals:
  Function:
    Timeout: 5
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        APP_CONFIGURATION_BUCKET: !Ref AppConfigurationBucketName
        WORKSPACE_BUCKET: !Ref WorkspaceBucketName
        ATHENA_DATABASE: !Ref AthenaDatabaseName
        AUDIT_QUEUE_URL: !Ref AuditQueueUrl
        APP_SYNC_URL: !Ref AppSyncUrl
        APP_SYNC_API_KEY: !Ref AppSyncApiKey
        USERPOOL_ARN: !Ref UserPoolArn
        DASHBOARD_RAW_DATA_BUCKET: !Ref DashboardRawDataBucketName

Resources:

  eTRONApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn
            Identity:
              Header: Authorization

  DataSourceCoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./data-sources/functions/data-source-core
      Handler: dataSourceHandler.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          POLLING_LAMBDA_NAME: !Ref DataSourcePollFunction
          DASHBOARD_RAW_DATA_BUCKET: !Ref DashboardRawDataBucketName
          DASHBOARD_RAW_DATA_QUEUE_URL: !Ref DashboardRawDataIngestQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: DataSources
        - DynamoDBCrudPolicy:
            TableName: Metrics
        - DynamoDBCrudPolicy:
            TableName: Workspaces
        - DynamoDBCrudPolicy:
            TableName: WorkspaceUsers
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt DataSourcePollFunction.Arn
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
                - ssm:DeleteParameter
                - ssm:GetParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
                - s3:GetBucketLocation
                - s3:HeadObject
              Resource: "*"
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetTable
                - glue:GetTables
                - glue:CreateTable
                - glue:UpdateTable
                - glue:DeleteTable
              Resource:
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource:
                - !Ref UserPoolArn

      Events:
        AddRemoteDataSource:
          Type: Api 
          Properties:
            Path: /day-book/data-sources/remote
            Method: post
            RestApiId: !Ref eTRONApi

        AddLocalDataSource:
          Type: Api 
          Properties:
            Path: /day-book/data-sources/local
            Method: post
            RestApiId: !Ref eTRONApi

        TestDataSourceConnection:
          Type: Api
          Properties:
            Path: /day-book/data-sources/test-connection
            Method: post
            RestApiId: !Ref eTRONApi

        UpdateDataSource:
          Type: Api 
          Properties:
            Path: /day-book/data-sources/{dataSourceId}
            Method: patch
            RestApiId: !Ref eTRONApi

        UpdateDataSourceData:
          Type: Api
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/update-data
            Method: put
            RestApiId: !Ref eTRONApi

        GetDataSourceById:
          Type: Api 
          Properties:
            Path: /day-book/data-sources/{dataSourceId}
            Method: get
            RestApiId: !Ref eTRONApi
            
        GetDataSources:
          Type: Api 
          Properties:
            Path: /day-book/data-sources
            Method: get
            RestApiId: !Ref eTRONApi

        GetUploadUrl:
          Type: Api
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/upload
            Method: get
            RestApiId: !Ref eTRONApi

        ViewData:
          Type: Api 
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/view-data
            Method: get
            RestApiId: !Ref eTRONApi

        ViewDataForMetric:
          Type: Api 
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/view-data-for-metric/{metricId}
            Method: get
            RestApiId: !Ref eTRONApi

        RemoveDataSource:
          Type: Api 
          Properties:
            Path: /day-book/data-sources/{dataSourceId}
            Method: delete
            RestApiId: !Ref eTRONApi

        RemotePreview:
          Type: Api
          Properties:
            Path: /day-book/data-sources/preview/remote
            Method: post
            RestApiId: !Ref eTRONApi

        PreviewSchema:
          Type: Api
          Properties:
            Path: /day-book/data-sources/preview-schema
            Method: post
            RestApiId: !Ref eTRONApi

        ConfirmSchema:
          Type: Api
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/confirm-schema
            Method: post
            RestApiId: !Ref eTRONApi

        PreviewSchemaForSource:
          Type: Api
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/preview-schema
            Method: post
            RestApiId: !Ref eTRONApi

        ActivateDataSource:
          Type: Api
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/activate
            Method: post
            RestApiId: !Ref eTRONApi

        GetAvailableSheets:
          Type: Api
          Properties:
            Path: /day-book/data-sources/available-spreadsheets
            Method: get
            RestApiId: !Ref eTRONApi

        RefreshDashboardRawData:
          Type: Api
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/dashboard-raw-data/refresh
            Method: post
            RestApiId: !Ref eTRONApi

        RescanMicromaxDashboard:
          Type: Api
          Properties:
            Path: /day-book/data-sources/{dataSourceId}/micromax-dashboard/rescan
            Method: post
            RestApiId: !Ref eTRONApi

            

  MetricFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./metrics/functions/metric-core
      Handler: metricHandler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Metrics
        - DynamoDBCrudPolicy:
            TableName: DataSources
        - DynamoDBCrudPolicy:
            TableName: Workspaces
        - DynamoDBCrudPolicy:
            TableName: WorkspaceUsers
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
                - ssm:DeleteParameter
                - ssm:GetParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
              Resource: "*"
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource:
                - !Ref UserPoolArn

      Events:
        AddMetric:
          Type: Api 
          Properties:
            Path: /day-book/metrics
            Method: post
            RestApiId: !Ref eTRONApi

        UpdateMetric:
          Type: Api 
          Properties:
            Path: /day-book/metrics/{metricId}
            Method: patch
            RestApiId: !Ref eTRONApi

        GetMetricById:
          Type: Api 
          Properties:
            Path: /day-book/metrics/{metricId}
            Method: get
            RestApiId: !Ref eTRONApi
            
        GetMetrics:
          Type: Api 
          Properties:
            Path: /day-book/metrics
            Method: get
            RestApiId: !Ref eTRONApi
        
        RemoveMetricsByDataSource:
          Type: Api 
          Properties:
            Path: /day-book/metrics/by-data-source/{dataSourceId}
            Method: get
            RestApiId: !Ref eTRONApi

        RemoveMetric:
          Type: Api 
          Properties:
            Path: /day-book/metrics/{metricId}
            Method: delete
            RestApiId: !Ref eTRONApi


  ReportDraftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./reports/functions/reports-drafts
      Handler: draftHandler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Reports
        - DynamoDBCrudPolicy:
            TableName: Workspaces
        - DynamoDBCrudPolicy:
            TableName: WorkspaceUsers
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
                - ssm:DeleteParameter
                - ssm:GetParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
              Resource: "*"
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource:
                - !Ref UserPoolArn

      Events:
        CreateDraft:
          Type: Api 
          Properties:
            Path: /day-book/reports/drafts
            Method: post
            RestApiId: !Ref eTRONApi

        UpdateDraft:
          Type: Api 
          Properties:
            Path: /day-book/reports/drafts/{draftId}
            Method: patch
            RestApiId: !Ref eTRONApi

        GetDraft:
          Type: Api 
          Properties:
            Path: /day-book/reports/drafts/{draftId}
            Method: get
            RestApiId: !Ref eTRONApi

        GetDrafts:
          Type: Api 
          Properties:
            Path: /day-book/reports/drafts
            Method: get
            RestApiId: !Ref eTRONApi

        DeleteDraft:
          Type: Api 
          Properties:
            Path: /day-book/reports/drafts/{draftId}
            Method: delete
            RestApiId: !Ref eTRONApi


  ReportTemplatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./reports/functions/reports-templates
      Handler: templateHandler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Reports
        - DynamoDBCrudPolicy:
            TableName: Workspaces
        - DynamoDBCrudPolicy:
            TableName: WorkspaceUsers
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
                - ssm:DeleteParameter
                - ssm:GetParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
              Resource: "*"
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource:
                - !Ref UserPoolArn

      Events:
        CreateTemplate:
          Type: Api 
          Properties:
            Path: /day-book/reports/templates
            Method: post
            RestApiId: !Ref eTRONApi

        UpdateTemplate:
          Type: Api 
          Properties:
            Path: /day-book/reports/templates/{templateId}
            Method: patch
            RestApiId: !Ref eTRONApi

        GetTemplate:
          Type: Api 
          Properties:
            Path: /day-book/reports/templates/{templateId}
            Method: get
            RestApiId: !Ref eTRONApi

        GetTemplates:
          Type: Api 
          Properties:
            Path: /day-book/reports/templates
            Method: get
            RestApiId: !Ref eTRONApi

        DeleteTemplate:
          Type: Api 
          Properties:
            Path: /day-book/reports/templates/{templateId}
            Method: delete
            RestApiId: !Ref eTRONApi

  ReportExportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./reports/functions/reports-exports
      Handler: exportHandler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Reports
        - DynamoDBCrudPolicy:
            TableName: Workspaces
        - DynamoDBCrudPolicy:
            TableName: WorkspaceUsers
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
                - ssm:DeleteParameter
                - ssm:GetParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
              Resource: "*"
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource:
                - !Ref UserPoolArn

      Events:
        AddExport:
          Type: Api 
          Properties:
            Path: /day-book/reports/exports
            Method: post
            RestApiId: !Ref eTRONApi

        GetExport:
          Type: Api 
          Properties:
            Path: /day-book/reports/exports/{exportId}
            Method: get
            RestApiId: !Ref eTRONApi

        GetExports:
          Type: Api 
          Properties:
            Path: /day-book/reports/exports
            Method: get
            RestApiId: !Ref eTRONApi

        GetExportDownloadUrl:
          Type: Api 
          Properties:
            Path: /day-book/reports/exports/{exportId}/download
            Method: get
            RestApiId: !Ref eTRONApi

  DataSourcePollInitialiser:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./data-sources/functions/polling/data-source-poller-initialiser
      Handler: initialiserHandler.handler
      Timeout: 30
      Environment:
        Variables:
          STATE_MACHINE_ARN: !GetAtt DataSourcePollingStateMachine.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: DataSources
        - DynamoDBCrudPolicy:
            TableName: Workspaces
        - S3WritePolicy:
            BucketName: !Ref WorkspaceBucketName
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref DataSourcePollingStateMachine
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
                - ssm:DeleteParameter
                - ssm:GetParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
                - s3:GetBucketLocation
                - s3:HeadObject
              Resource: "*"

      Events:
        PollSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)

  DataSourcePollFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./data-sources/functions/polling/data-source-poller
      Handler: dataSourcePollHandler.handler
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: DataSources
        - DynamoDBCrudPolicy:
            TableName: Workspaces
        - S3WritePolicy:
            BucketName: !Ref WorkspaceBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
                - ssm:DeleteParameter
                - ssm:GetParameters
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
                - s3:GetBucketLocation
                - s3:HeadObject
              Resource: "*"
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetTable
                - glue:GetTables
                - glue:CreateTable
                - glue:UpdateTable
                - glue:DeleteTable
              Resource:
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*

  DataSourcePollingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt DataSourcePollingStateMachineRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "PollDataSources",
          "States": {
            "PollDataSources": {
              "Type": "Map",
              "ItemsPath": "$.dataSources",
              "MaxConcurrency": 10,
              "Iterator": {
                "StartAt": "PollAndSave",
                "States": {
                  "PollAndSave": {
                    "Type": "Task",
                    "Resource": "${DataSourcePollFunction.Arn}",
                    "End": true
                  }
                }
              },
              "End": true
            }
          }
        }

  DataSourcePollingStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowInvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: 
                  - !GetAtt DataSourcePollFunction.Arn
                  - !Sub "${DataSourcePollFunction.Arn}:*"

  DataSourceUploadProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./data-sources/functions/data-source-upload-processor
      Handler: fileUploadHandler.handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: DataSources
        - S3ReadPolicy:
            BucketName: !Ref WorkspaceBucketName
        - S3WritePolicy:
            BucketName: !Ref WorkspaceBucketName
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - s3:DeleteObject
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:GetBucketLocation
                - s3:HeadObject
              Resource: !Sub arn:aws:s3:::${WorkspaceBucketName}/*
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetTable
                - glue:GetTables
                - glue:CreateTable
                - glue:UpdateTable
                - glue:DeleteTable
              Resource:
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*

  DashboardRawDataIngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: DashboardRawDataIngestQueue
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DashboardRawDataIngestDLQ.Arn
        maxReceiveCount: 3

  DashboardRawDataIngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: DashboardRawDataIngestDLQ
      MessageRetentionPeriod: 1209600

  DashboardRawDataIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./data-sources/functions/dashboard-raw-data-ingest
      Handler: dashboardRawDataIngestHandler.handler
      Description: EventBridge handler that materialises micromax-dashboard-file data sources from S3 events on the dashboard raw data bucket.
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DASHBOARD_RAW_DATA_QUEUE_URL: !Ref DashboardRawDataIngestQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DashboardRawDataIngestQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: DataSources
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
                - s3:ListBucket
                - s3:PutObject
              Resource: "*"
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetTable
                - glue:DeleteTable
                - glue:UpdateTable
              Resource:
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*
      Events:
        ObjectCreated:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - "Object Created"
              detail:
                bucket:
                  name:
                    - !Ref DashboardRawDataBucketName
                object:
                  key:
                    - wildcard: "exports/*.json"
        ObjectDeleted:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - "Object Deleted"
              detail:
                bucket:
                  name:
                    - !Ref DashboardRawDataBucketName
                object:
                  key:
                    - wildcard: "exports/*.json"

  DashboardRawDataTransformFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./data-sources/functions/dashboard-raw-data-transform
      Handler: dashboardRawDataTransformHandler.handler
      Description: SQS consumer that converts dashboard-raw-data JSON uploads to parquet and writes them to the normal data source location.
      Timeout: 300
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: DataSources
        - S3ReadPolicy:
            BucketName: !Ref DashboardRawDataBucketName
        - S3WritePolicy:
            BucketName: !Ref WorkspaceBucketName
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
                - s3:GetBucketLocation
                - s3:HeadObject
              Resource:
                - !Sub arn:aws:s3:::${WorkspaceBucketName}
                - !Sub arn:aws:s3:::${WorkspaceBucketName}/*
                - !Sub arn:aws:s3:::${DashboardRawDataBucketName}
                - !Sub arn:aws:s3:::${DashboardRawDataBucketName}/*
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetTable
                - glue:GetTables
                - glue:CreateTable
                - glue:UpdateTable
                - glue:DeleteTable
              Resource:
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*
      Events:
        IngestQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt DashboardRawDataIngestQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  DataUpdateNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./data-sources/functions/data-update-notifier
      Handler: dataUpdateHandler.handler
      Timeout: 30
      Environment:
        Variables:
          APPSYNC_URL: !Ref AppSyncUrl
          APPSYNC_API_KEY: !Ref AppSyncApiKey
          WORKSPACE_BUCKET: !Ref WorkspaceBucketName
      Policies:
        - DynamoDBReadPolicy:
            TableName: DataSources
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${WorkspaceBucketName}/*
      Events:
        S3DataUpdate:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - "Object Created"
              detail:
                bucket:
                  name:
                    - !Ref WorkspaceBucketName
                object:
                  key:
                    - prefix: "workspaces/"